<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/jobseekerpage/seekerhistoryUtil.css">

  <script>
    // Check if user is logged in
    const authToken = sessionStorage.getItem('authToken');
    const userType = sessionStorage.getItem('userType');

    if (!authToken || userType !== 'jobseeker') {
      alert("You are not authorized to view this page. Please log in.");
      window.location.href = "../index.html"; // Redirect to login page
    }
  </script>
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

  <!-- Top Section -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-nb">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="#"><u><b>Rojjgar.com</b></u></a>
      <div class="d-flex align-items-center">
        <img src="../assets/unnamed1.png" alt="Profile Image" class="rounded-circle me-2" width="40" height="40" style="cursor:pointer;" data-bs-toggle="modal" data-bs-target="#profileModal">
        <h1 id="rg1" class="h5 mb-0 text-white"></h1>
      </div>
      <div class="d-flex gap-2">
        <a href="jobseekerPage.html" class="btn btn-warning btn-sm">Go Back</a>
        <button class="btn btn-warning btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container flex-grow-1 my-5">
    <div class="text-center mb-4">
      <h2>Job History</h2>
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-bordered text-center align-middle">
        <thead class="table-primary">
          <tr>
            <th>Skill</th>
            <th>Date</th>
            <th>Provider</th>
          </tr>
        </thead>
        <tbody id="job-history-body">
          <!-- Data will be populated dynamically -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Footer (optional) -->
  <footer class="bg-nb text-light pt-4 mt-5">
    <div class="container">
      <div class="row text-center text-md-start">

        <div class="col-md-3 mb-4">
          <h5><u><b>Rojgar.com</b></u></h5>
        </div>

        <div class="col-md-3 mb-4">
          <h6>Quick Links</h6>
          <ul class="list-unstyled">
            <li>Home</li>
            <li>About Us</li>
            <li>Our Mission</li>
            <li>Job Corner</li>
            <li>Reviews</li>
          </ul>
        </div>

        <div class="col-md-3 mb-4">
          <h6>Contacts</h6>
          <ul class="list-unstyled">
            <li>+91 6267596219</li>
            <li>+91 8808722101</li>
            <li>support@rojjgar.com</li>
          </ul>
        </div>

        <div class="col-md-3 mb-4">
          <h6>Follow Us</h6>
          <ul class="list-unstyled">
            <li>Instagram</li>
            <li>Facebook</li>
            <li>X</li>
            <li>Koo</li>
          </ul>
        </div>

      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script>
    const responseData = sessionStorage.getItem('responseData');
    if (responseData) {
      const responseObject = JSON.parse(responseData);
      const jobSkills = responseObject.finduser.historyJobskill || [];
      const jobDates = responseObject.finduser.historyJobDate || [];
      const jobProviders = responseObject.finduser.historyJobProvider || [];

      const tableBody = document.getElementById('job-history-body');
      if (jobSkills.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="3">No job history found.</td></tr>';
      } else {
        jobSkills.forEach((skill, index) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${skill || 'N/A'}</td>
            <td>${jobDates[index] ? new Date(jobDates[index]).toLocaleDateString() : 'N/A'}</td>
            <td>${jobProviders[index] || 'N/A'}</td>
          `;
          tableBody.appendChild(row);
        });
      }
    } else {
      document.getElementById('job-history-body').innerHTML = '<tr><td colspan="3">No job history found.</td></tr>';
    }

    function logout() {
      sessionStorage.removeItem('responseData');
      sessionStorage.removeItem('authToken');
      sessionStorage.removeItem('userType');
      window.location.href = "../index.html"; // Redirect to login page
    }
  </script>

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
