<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Results</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/searchpage/searchpageUtil.css">

  <script>
    // Check if user is logged in
    const authToken = sessionStorage.getItem('authToken');
    const userType = sessionStorage.getItem('userType');

    if (!authToken || userType !== 'user') {
      alert("You are not authorized to view this page. Please log in.");
      window.location.href = "../index.html"; // Redirect to login page
    }
  </script>
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-nb">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="#"><u><b>Rojjgar.com</b></u></a>
      <div class="d-flex align-items-center">
        <img src="../assets/unnamed1.png" alt="Profile Image" class="rounded-circle me-2" width="40" height="40" style="cursor:pointer;" data-bs-toggle="modal" data-bs-target="#profileModal">
        <h1 id="rg1" class="h5 mb-0 text-white"></h1>
      </div>
      <div class="d-flex gap-2">
        <a href="userPage.html" class="btn btn-warning btn-sm">Go Back</a>
        <button class="btn btn-warning btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Profile Modal -->
  <div class="modal fade" id="profileModal" tabindex="-1" aria-labelledby="profileModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header text-white bg-nb">
          <h5 class="modal-title" id="profileModalLabel">User Profile</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p><strong>Name:</strong></p>
          <p><strong>Email:</strong></p>
          <p><strong>Phone:</strong></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-warning text-white" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="card shadow w-100" style="max-width: 800px;">
      <div class="card-body">
        <h2 class="card-title text-center mb-4">Search Results:</h2>
        <div id="results-container" class="d-grid gap-3"></div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-auto text-white py-4 bg-nb">
    <div class="container">
      <div class="row text-center">
        <div class="col-md-3 mb-3">
          <h4><u><b>Rojjgar.com</b></u></h4>
        </div>
        <div class="col-md-3 mb-3">
          <ul class="list-unstyled">
            <li>Home</li>
            <li>About Us</li>
            <li>Our Mission</li>
            <li>Job Corner</li>
            <li>Reviews</li>
          </ul>
        </div>
        <div class="col-md-3 mb-3">
          <ul class="list-unstyled">
            <li><strong>Contacts:</strong></li>
            <li>+91 6267596219</li>
            <li>+91 8808722101</li>
            <li>support@rojjgar.com</li>
          </ul>
        </div>
        <div class="col-md-3 mb-3">
          <ul class="list-unstyled">
            <li><strong>Follow Us:</strong></li>
            <li>Instagram</li>
            <li>Facebook</li>
            <li>X</li>
            <li>Koo</li>
          </ul>
        </div>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS Bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script for showing search results -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const responseJobSeekerData = sessionStorage.getItem("responseJobSeekerData");
      const resultsContainer = document.getElementById("results-container");

      if (responseJobSeekerData) {
        const jobSeekers = JSON.parse(responseJobSeekerData);
        if (Array.isArray(jobSeekers) && jobSeekers.length > 0) {
          jobSeekers.forEach(seeker => {
            const seekerDiv = document.createElement("div");
            seekerDiv.className = "card p-3 shadow-sm";
            seekerDiv.innerHTML = `
              <h5 class="card-title">Name: ${seeker.name}</h5>
              <p class="card-text mb-1">Contact: ${seeker.contact}</p>
              <p class="card-text mb-1">State: ${seeker.state}</p>
              <p class="card-text mb-1">District: ${seeker.district}</p>
              <p class="card-text mb-1">City: ${seeker.cityname}</p>
              <p class="card-text mb-3">Pincode: ${seeker.pincode}</p>
              <a href="tel:+91${seeker.contact}" class="btn btn-warning text-white">Call</a>
            `;
            resultsContainer.appendChild(seekerDiv);
          });
        } else {
          resultsContainer.innerHTML = "<p class='text-center text-muted'>No job seekers found for the selected skill.</p>";
        }
      } else {
        resultsContainer.innerHTML = "<p class='text-center text-muted'>No search results available.</p>";
      }
    });

    function logout() {
      sessionStorage.removeItem('responseData');
      sessionStorage.removeItem('authToken');
      sessionStorage.removeItem('userType');
      window.location.href = "../index.html"; // Redirect to login page
    }
  </script>

</body>
</html>
