<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup User</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <form id="signupForm" class="row g-3 bg-light p-4 rounded shadow">
            <div class="col-md-6">
                <label for="username4" class="form-label">Name</label>
                <input type="text" id="username4" name="username" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label for="usercontact4" class="form-label">Contact</label>
                <input type="tel" id="usercontact4" name="usercontact" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label for="useremail4" class="form-label">Email</label>
                <input type="email" id="useremail4" name="useremail4" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label for="userpassc4" class="form-label">Password</label>
                <input type="password" id="userpassc4" name="userpassword4" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label for="userstate4" class="form-label">State</label>
                <select id="userstate4" name="userstate4" class="form-select" required>
                    <option selected disabled>Select State</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                </select>
            </div>

            <div class="col-md-6">
                <label for="userdist4" class="form-label">District</label>
                <select id="userdist4" name="userdist4" class="form-select" required>
                    <option selected disabled>Select District</option>
                </select>
            </div>

            <div class="col-md-6">
                <label for="userct4" class="form-label">City</label>
                <select id="userct4" name="userct4" class="form-select" required>
                    <option selected disabled>Select City</option>
                </select>
            </div>

            <div class="col-md-6">
                <label for="userpn4" class="form-label">Pincode</label>
                <input type="text" id="userpn4" name="userpn4" class="form-control" required>
            </div>

            <div class="col-md-12">
                <label for="addressLine" class="form-label">Address Line</label>
                <input type="text" id="addressLine" name="addressLine" class="form-control" required>
            </div>

            <div class="col-md-12">
                <label for="usercncl4" class="form-label">Counsellor</label>
                <input type="text" id="usercncl4" name="usercncl4" class="form-control" required>
            </div>

            <div class="col-12 d-flex justify-content-between">
                <button type="submit" class="btn btn-success px-4">Submit</button>
                <button type="button" class="btn btn-outline-danger" onclick="window.history.back()">Cancel</button>
            </div>
        </form>
    </div>

    <script>
        const stateSelect = document.getElementById("userstate4");
        const districtSelect = document.getElementById("userdist4");
        const citySelect = document.getElementById("userct4");

        const districtByState = {
            "Uttar Pradesh" : ["Prayagraj"]
        };

        const cityByDistrict = {
            "Prayagraj" : ["Sadar", "Koraon", "Phulpur", "Handia", "Meja", "Bara", "Dhoomganj", "Naini", "Prayagraj"]
        };

        stateSelect.addEventListener('change', () => {
            const selectedState = stateSelect.value;
            const districts = districtByState[selectedState] || [];

            districtSelect.innerHTML = '<option selected disabled>Select District</option>';
            citySelect.innerHTML = '<option selected disabled>Select City</option>';

            districts.forEach(district => {
                const option = document.createElement("option");
                option.value = district;
                option.textContent = district;
                districtSelect.appendChild(option);
            });
        });

        districtSelect.addEventListener('change', () => {
            const selectedDistrict = districtSelect.value;
            const cities = cityByDistrict[selectedDistrict] || [];

            citySelect.innerHTML = '<option selected disabled>Select City</option>';
            cities.forEach(city => {
                const option = document.createElement("option");
                option.value = city;
                option.textContent = city;
                citySelect.appendChild(option);
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/Signups/jobseekerSignup.js"></script>
</body>
</html>
